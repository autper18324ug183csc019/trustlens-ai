<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>QR Trust Analysis - TrustLens AI</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }

    body {
        background: #f2f6ff;
        min-height: 100vh;
        padding: 30px 20px;
        color: #1e293b;
    }

    .container {
        max-width: 480px;
        margin: 0 auto;
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0px 0px 15px gray;
    }

    h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #2563eb;
    }

    .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
    }

    .tab-btn {
        flex: 1;
        padding: 10px;
        background: #f2f6ff;
        border: 1px solid gray;
        color: #64748b;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
    }

    .tab-btn.active {
        background: #2563eb;
        color: white;
        font-weight: bold;
        border-color: #2563eb;
    }

    .tab-content {
        display: none;
    }

    .tab-content.active {
        display: block;
    }

    #reader {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        margin-bottom: 12px;
    }

    #reader-upload {
        width: 100%;
        border-radius: 8px;
        overflow: hidden;
        margin-top: 12px;
    }

    input[type="file"] {
        width: 100%;
        padding: 10px;
        border-radius: 5px;
        border: 1px dashed gray;
        background: #f2f6ff;
        color: #1e293b;
        margin-bottom: 12px;
    }

    .analyze-btn {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        background: #2563eb;
        color: white;
        font-weight: bold;
        cursor: pointer;
        font-size: 14px;
    }

    .analyze-btn:hover {
        background: #1d4ed8;
    }

    .analyze-btn:disabled {
        background: #cbd5e1;
        color: #64748b;
        cursor: not-allowed;
    }

    .file-name {
        font-size: 13px;
        color: #64748b;
        margin-bottom: 10px;
        word-break: break-all;
    }

    .hint-text {
        font-size: 13px;
        color: #64748b;
        text-align: center;
        margin-bottom: 10px;
    }

    .result-box {
        margin-top: 20px;
        padding: 16px;
        background: #f2f6ff;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
    }

    .result-box h3 {
        margin-bottom: 10px;
        font-size: 15px;
        color: #2563eb;
    }

    .score-line {
        font-size: 18px;
        font-weight: bold;
        margin-bottom: 10px;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
    }

    table td {
        padding: 6px 4px;
        border-bottom: 1px solid #cbd5e1;
    }

    .qr-text {
        word-break: break-all;
        font-size: 13px;
        color: #64748b;
        margin-bottom: 12px;
        padding: 8px;
        background: white;
        border-radius: 6px;
        border: 1px solid #cbd5e1;
    }

    .error-msg {
        color: red;
        text-align: center;
        margin-top: 10px;
        font-size: 14px;
    }

    .back-btn-wrapper {
        text-align: center;
        margin-top: 24px;
    }

    .back-btn {
        display: inline-block;
        color: #64748b;
        text-decoration: none;
        font-size: 14px;
        padding: 10px 20px;
        border: 1px solid gray;
        border-radius: 5px;
    }

    .back-btn:hover {
        background: #f2f6ff;
        color: #2563eb;
        border-color: #2563eb;
    }
</style>
</head>
<body>

<div class="container">
    <h2>🔍 QR Trust Analysis</h2>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('camera')">📷 Camera</button>
        <button class="tab-btn" onclick="switchTab('upload')">🖼️ Upload</button>
    </div>

    <div id="camera-tab" class="tab-content active">
        <div id="reader"></div>
        <p class="hint-text">QR code ah camera frame kulla vechu, "Capture" button click pannunga</p>
        <button class="analyze-btn" id="captureBtn" onclick="capturePhoto()">📸 Capture</button>
    </div>

    <div id="upload-tab" class="tab-content">
        <input type="file" id="qrFileInput" accept="image/*">
        <div class="file-name" id="fileNameLabel"></div>
        <button class="analyze-btn" id="analyzeBtn" onclick="analyzeUploadedFile()" disabled>Analyze Image</button>
        <div id="reader-upload"></div>
    </div>

    <p id="errorMsg" class="error-msg"></p>

    <div id="resultBox" class="result-box" style="display:none;">
        <h3>Scanned Content:</h3>
        <div class="qr-text" id="qrTextValue"></div>

        <div class="score-line" id="qrScoreLine"></div>
        <table id="qrResultsTable"></table>

        <div id="websiteSection" style="display:none; margin-top:16px;">
            <h3>Website Analysis:</h3>
            <div class="score-line" id="websiteScoreLine"></div>
            <table id="websiteResultsTable"></table>
        </div>
    </div>

    <div class="back-btn-wrapper">
        <a href="/dashboard" class="back-btn">← Back </a>
    </div>
</div>

<script>
let html5QrCode;
let html5QrCodeUpload;
let selectedFile = null;
let cameraRunning = false;

function switchTab(tab) {
    document.getElementById("camera-tab").classList.remove("active");
    document.getElementById("upload-tab").classList.remove("active");
    document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));

    document.getElementById(tab + "-tab").classList.add("active");
    event.target.classList.add("active");

    document.getElementById("errorMsg").textContent = "";

    if (tab === "camera") {
        startCamera();
    } else {
        stopCamera();
    }
}

function startCamera() {
    if (html5QrCode) return;

    html5QrCode = new Html5Qrcode("reader");

    Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length) {
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: 220 },
                (decodedText) => {
                    // Auto-detected - still allowed, but manual capture also works
                    submitQrData(decodedText);
                },
                () => {}
            ).then(() => {
                cameraRunning = true;
            });
        }
    }).catch(err => {
        document.getElementById("errorMsg").textContent = "Camera not available: " + err;
    });
}

function stopCamera() {
    if (html5QrCode && cameraRunning) {
        html5QrCode.stop().then(() => {
            html5QrCode.clear();
            html5QrCode = null;
            cameraRunning = false;
        }).catch(() => {
            html5QrCode = null;
            cameraRunning = false;
        });
    }
}

function capturePhoto() {
    document.getElementById("errorMsg").textContent = "";

    const videoEl = document.querySelector("#reader video");

    if (!videoEl) {
        document.getElementById("errorMsg").textContent = "Camera not ready yet. Please wait a moment and try again.";
        return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = videoEl.videoWidth;
    canvas.height = videoEl.videoHeight;

    const ctx = canvas.getContext("2d");
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);

    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);

    if (code) {
        submitQrData(code.data);
    } else {
        document.getElementById("errorMsg").textContent = "No QR code detected. Position the QR clearly in frame and try again.";
    }
}

document.getElementById("qrFileInput").addEventListener("change", function (e) {
    const file = e.target.files[0];
    document.getElementById("errorMsg").textContent = "";

    if (file) {
        selectedFile = file;
        document.getElementById("fileNameLabel").textContent = "Selected: " + file.name;
        document.getElementById("analyzeBtn").disabled = false;
    } else {
        selectedFile = null;
        document.getElementById("fileNameLabel").textContent = "";
        document.getElementById("analyzeBtn").disabled = true;
    }
});

function analyzeUploadedFile() {
    if (!selectedFile) {
        document.getElementById("errorMsg").textContent = "Please choose an image first.";
        return;
    }

    document.getElementById("errorMsg").textContent = "";
    document.getElementById("analyzeBtn").disabled = true;
    document.getElementById("analyzeBtn").textContent = "Analyzing...";

    const reader = new FileReader();

    reader.onload = function (e) {
        const img = new Image();

        img.onload = function () {
            const canvas = document.createElement("canvas");
            canvas.width = img.width;
            canvas.height = img.height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, img.width, img.height);

            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const code = jsQR(imageData.data, imageData.width, imageData.height);

            document.getElementById("analyzeBtn").disabled = false;
            document.getElementById("analyzeBtn").textContent = "Analyze Image";

            if (code) {
                submitQrData(code.data);
            } else {
                document.getElementById("errorMsg").textContent = "Could not read QR code from this image. Try a clearer, well-lit photo with the QR code filling most of the frame.";
            }
        };

        img.onerror = function () {
            document.getElementById("analyzeBtn").disabled = false;
            document.getElementById("analyzeBtn").textContent = "Analyze Image";
            document.getElementById("errorMsg").textContent = "Invalid image file.";
        };

        img.src = e.target.result;
    };

    reader.readAsDataURL(selectedFile);
}

async function submitQrData(decodedText) {
    document.getElementById("errorMsg").textContent = "";

    const formData = new FormData();
    formData.append("qr_data", decodedText);

    try {
        const response = await fetch("/qr", {
            method: "POST",
            headers: { "X-Requested-With": "XMLHttpRequest" },
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            renderResults(data);
        } else {
            document.getElementById("errorMsg").textContent = data.message || "Something went wrong.";
        }

    } catch (err) {
        document.getElementById("errorMsg").textContent = "Something went wrong. Please try again.";
    }
}

function renderResults(data) {
    document.getElementById("resultBox").style.display = "block";
    document.getElementById("qrTextValue").textContent = data.qr_data;

    document.getElementById("qrScoreLine").textContent =
        `Score: ${data.score}/100 — ${data.status} (${data.content_type})`;

    const qrTable = document.getElementById("qrResultsTable");
    qrTable.innerHTML = "";
    data.results.forEach(row => {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td>`;
        qrTable.appendChild(tr);
    });

    if (data.website_score !== null && data.website_score !== undefined) {
        document.getElementById("websiteSection").style.display = "block";
        document.getElementById("websiteScoreLine").textContent =
            `Score: ${data.website_score}/100 — ${data.website_status}`;

        const webTable = document.getElementById("websiteResultsTable");
        webTable.innerHTML = "";
        data.website_results.forEach(row => {
            const tr = document.createElement("tr");
            tr.innerHTML = `<td>${row[0]}</td><td>${row[1]}</td>`;
            webTable.appendChild(tr);
        });
    } else {
        document.getElementById("websiteSection").style.display = "none";
    }
}

// Start camera by default on page load
window.addEventListener("load", startCamera);

// Escape key -> go back to dashboard
document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
        window.location.href = "/dashboard";
    }
});
</script>

</body>
</html>
