<!DOCTYPE html>

<html>
<head>
    <title>Sign In - TrustLens AI</title>


<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f6ff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .login-box { 
    background: white; 
    width: 350px; 
    padding: 30px; 
    border-radius: 10px; 
    box-shadow: 0px 0px 15px gray;
    position: relative;
    }

    .close-btn {
    position: absolute;
    top: 10px;
    right: 15px;
    
    font-size: 24px;
    font-weight: bold;
    color: #64748b;
    
    text-decoration: none;
    }

    .close-btn:hover {
        color: #ef4444;
    }

    h2 {
        text-align: center;
        color: #2563eb;
    }

        input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: 1px solid gray;
        box-sizing: border-box;
    }

    button {
        width: 100%;
        padding: 10px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    p {
        text-align: center;
    }

    a {
        color: #2563eb;
        text-decoration: none;
    }

    .popup-overlay {
        display: none;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 255, 255, 0.95);
        border-radius: 10px;
        align-items: center;
        justify-content: center;
        z-index: 10;
    }

    .popup-overlay.show {
        display: flex;
    }

    .popup-box {
        background: white;
        border: 1px solid #e2e8f0;
        box-shadow: 0px 0px 15px gray;
        border-radius: 8px;
        padding: 24px;
        width: 85%;
        text-align: center;
    }

    .popup-box.error {
        border-top: 4px solid #ef4444;
    }

    .popup-box.success {
        border-top: 4px solid #22c55e;
    }

    .popup-box p {
        color: #1e293b;
        margin-bottom: 16px;
        font-size: 14.5px;
        line-height: 1.4;
    }

    .popup-box button {
        margin-top: 0;
    }

    .password-wrapper {
        position: relative;
        margin: 10px 0;
    }

        .password-wrapper input {
        margin: 0;
        padding-right: 40px;
        width: 100%;
        box-sizing: border-box;
    }

    .toggle-eye {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        cursor: pointer;
        color: #64748b;
        user-select: none;
        display: flex;
        align-items: center;
    }

    .toggle-eye:hover {
        color: #2563eb;
    }

</style>


</head>

<body>

<div class="login-box">

<a href="/" class="close-btn">✕</a>

<h2>TrustLens AI</h2>

<form id="signinForm">

    <input type="text" 
           name="userid" 
           placeholder="User ID"
           required>

    <div class="password-wrapper">
        <input type="password" 
               id="password"
               name="password" 
               placeholder="Password"
               required>
        <span class="toggle-eye" onclick="togglePassword('password', this)">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        </span>
    </div>

    <button type="submit">
        Sign In
    </button>

</form>

<div class="popup-overlay" id="popupOverlay">
    <div class="popup-box" id="popupBox">
        <p id="popupMessage"></p>
        <button onclick="closePopup()">Close</button>
    </div>
</div>

<p>
    Don't have an account?
    <a href="/signup">Sign Up</a>
</p>

<p>
    <a href="/forgot-password">Forgot Password?</a>
</p>

</div>

<script>
const form = document.getElementById("signinForm");
const popupOverlay = document.getElementById("popupOverlay");
const popupBox = document.getElementById("popupBox");
const popupMessage = document.getElementById("popupMessage");

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const formData = new FormData(form);

    try {
        const response = await fetch("/signin", {
            method: "POST",
            headers: {
                "X-Requested-With": "XMLHttpRequest"
            },
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            popupMessage.textContent = "Login successful!";
            popupBox.className = "popup-box success";
            popupOverlay.classList.add("show");

            setTimeout(() => {
                window.location.href = data.redirect || "/dashboard";
            }, 800);

        } else {
            popupMessage.textContent = data.message;
            popupBox.className = "popup-box error";
            popupOverlay.classList.add("show");
        }

    } catch (err) {
        popupMessage.textContent = "Something went wrong. Please try again.";
        popupBox.className = "popup-box error";
        popupOverlay.classList.add("show");
    }
});

function closePopup() {
    popupOverlay.classList.remove("show");
}

function togglePassword(fieldId, icon) {
    const field = document.getElementById(fieldId);

    if (field.type === "password") {
        field.type = "text";
        icon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
        `;
    } else {
        field.type = "password";
        icon.innerHTML = `
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
            </svg>
        `;
    }
}
</script>

</body>
</html>
