<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Forgot Password - TrustLens AI</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background: #f2f6ff;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            margin: 0;
        }

        .forgot-box {
            background: white;

            width: 350px;

            padding: 30px;

            border-radius: 10px;

            box-shadow: 0px 0px 15px gray;

            position: relative;
        }

        .close-btn {
            position: absolute;

            top: 10px;
            right: 15px;

            font-size: 24px;
            font-weight: bold;

            color: #64748b;

            text-decoration: none;
        }

        .close-btn:hover {
            color: red;
        }

        h2 {
            text-align: center;
            color: #2563eb;

            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 10px;

            margin: 10px 0;

            border-radius: 5px;

            border: 1px solid gray;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            padding: 10px;

            margin-top: 10px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 5px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .message {
            text-align: center;

            margin-top: 15px;
        }

        .error {
            color: red;
        }

        .success {
            color: green;
        }

            .password-wrapper {
        position: relative;
        margin-bottom: 14px;
    }

    .password-wrapper input {
        margin-bottom: 0;
        padding-right: 40px;
        width: 100%;
    }

        .toggle-eye {
        position: absolute;
        top: 50%;
        right: 12px;
        transform: translateY(-50%);
        cursor: pointer;
        color: #64748b;
        user-select: none;
        display: flex;
        align-items: center;
    }

    .toggle-eye:hover {
        color: #2563eb;
    }

    </style>

</head>


<body>


<div class="forgot-box">


    <!-- Close Button -->

    <a href="/signin" class="close-btn">
        ✕
    </a>


    <h2>
        🔐 Forgot Password
    </h2>


    <form method="POST">


        <input
            type="text"
            name="userid"
            placeholder="Enter User ID"
            required>

        <div class="password-wrapper">
            <input
                type="password"
                id="new_password"
                name="new_password"
                placeholder="Enter New Password"
                required>
            <span class="toggle-eye" onclick="togglePassword('new_password', this)">👁</span>
        </div>

        <div class="password-wrapper">
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Confirm New Password"
                required>
            <span class="toggle-eye" onclick="togglePassword('confirm_password', this)">👁</span>
        </div>

        <button type="submit">
            Reset Password
        </button>


    </form>


    {% if error %}

        <p class="message error">
            {{ error }}
        </p>

    {% endif %}


    {% if success %}

        <p class="message success">
            {{ success }}
        </p>

    {% endif %}


</div>


<script>

    document.addEventListener("keydown", function(event) {

        if (event.key === "Escape") {

            window.location.href = "/signin";

        }

    });

    function togglePassword(fieldId, icon) {
        const field = document.getElementById(fieldId);

        if (field.type === "password") {
            field.type = "text";
            icon.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
            `;
        } else {
            field.type = "password";
            icon.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            `;
        }
    }

</script>


</body>

</html>
